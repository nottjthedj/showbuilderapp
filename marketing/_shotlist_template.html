<title>__TITLE__</title>
<style>
  :root{
    color-scheme: dark;
    --ground:#08080b; --panel:#0e0e14; --panel2:#12121a;
    --line:rgba(255,255,255,.10); --ink:#f4f4f8; --mut:#8f8fa6; --dim:#5c5c72;
    --cyan:#00e5ff; --pink:#ff2d9b; --gold:#f5c542; --warn:#ff5a6e;
    --display:"Haettenschweiler","Arial Narrow Bold",Impact,"Franklin Gothic Bold",sans-serif;
    --body:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#16121c 0%,var(--ground) 60%) no-repeat,var(--ground);
    color:var(--ink);font-family:var(--body);line-height:1.6;padding:0 0 90px;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.045;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}

  header{padding:46px 0 6px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 12px;}
  h1{font-family:var(--display);font-weight:400;text-transform:uppercase;
    font-size:clamp(36px,7.5vw,76px);line-height:.88;margin:0;letter-spacing:.02em;text-wrap:balance;}
  h1 .a{color:transparent;-webkit-text-stroke:1.5px var(--pink);text-shadow:0 0 18px rgba(255,45,155,.5);}
  h1 .b{color:transparent;-webkit-text-stroke:1.5px var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.45);}
  .standfirst{color:var(--mut);font-size:16px;max-width:68ch;margin:18px 0 0;}
  .standfirst b{color:var(--ink);font-weight:600;}

  h2.sec{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(22px,3.2vw,30px);
    margin:44px 0 4px;letter-spacing:.02em;}
  ol.how,ul.how{margin:14px 0 0;padding-left:20px;color:var(--mut);font-size:15px;max-width:78ch;}
  ol.how li,ul.how li{margin:0 0 9px;}
  ol.how b,ul.how b{color:var(--ink);}

  /* character-mode toolbar */
  .tools{margin:26px 0 0;padding:15px 17px;border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.022);max-width:78ch;}
  .sw{display:flex;align-items:center;gap:11px;cursor:pointer;font-size:14.5px;color:var(--ink);}
  .sw input{position:absolute;opacity:0;width:0;height:0;}
  .sw span{flex:0 0 40px;height:22px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);position:relative;transition:.16s;}
  .sw span::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
    background:var(--mut);transition:.16s;}
  .sw input:checked + span{border-color:#00e5ff;background:rgba(0,229,255,.16);}
  .sw input:checked + span::after{left:21px;background:#00e5ff;}
  .sw input:focus-visible + span{outline:2px solid #00e5ff;outline-offset:2px;}
  .toolnote{margin:9px 0 0;font-size:13.5px;color:var(--mut);line-height:1.6;}
  .toolnote b{color:var(--ink);font-weight:600;}
  .toolnote code{font-family:var(--mono);font-size:12px;color:#00e5ff;}
  .tok{display:flex;align-items:center;gap:9px;margin:0 0 12px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .tok input{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;padding:7px 10px;
    width:190px;text-transform:none;}
  .tok input:focus{outline:none;border-color:var(--cc);}

  /* jump nav */
  .jump{position:sticky;top:0;z-index:60;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
    padding:13px 0;background:linear-gradient(180deg,rgba(8,8,11,.97) 74%,rgba(8,8,11,0));margin-top:22px;}
  .jump a{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--jc);color:var(--jc);border-radius:999px;padding:8px 13px;text-decoration:none;}
  .jump a:hover{background:color-mix(in srgb,var(--jc) 16%,transparent);}
  .jump a b{color:var(--ink);font-weight:400;margin-left:5px;}

  /* character block */
  .char{margin:44px 0 0;scroll-margin-top:70px;}
  .chead{border-top:2px solid var(--cc);padding-top:16px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .chead h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(26px,4.4vw,40px);
    margin:0;color:var(--cc);letter-spacing:.02em;}
  .chead .cnt{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.12em;margin-left:auto;
    font-variant-numeric:tabular-nums;}

  .card{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.02);
    overflow:hidden;margin:14px 0 0;}
  .card.seed{border-color:var(--cc);}
  .card.lock{border-style:dashed;}
  .cardh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 15px;
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--cc);font-weight:800;}
  .card.lock .cardh{color:var(--mut);}
  .cardb{padding:13px 15px;font-size:14.5px;line-height:1.6;color:#cfcfdd;}
  .cardb code{font-family:var(--mono);font-size:12.5px;line-height:1.62;color:#c6d2da;display:block;white-space:pre-wrap;}

  /* clips */
  .clips{display:grid;gap:9px;margin-top:14px;}
  .clip{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);
    border-left:3px solid var(--rc);overflow:hidden;}
  .clip.money{border-color:rgba(255,45,155,.4);}
  .clip.ens{border-color:rgba(255,90,110,.45);box-shadow:0 0 20px rgba(255,90,110,.1);}
  .ch2{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:12px 15px;cursor:pointer;}
  .cid{font-family:var(--display);font-weight:400;font-size:21px;color:var(--rc);letter-spacing:.03em;min-width:62px;line-height:1;}
  .cmid{min-width:0;}
  .role{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
    color:#08080b;background:var(--rc);border-radius:4px;padding:2px 6px;font-weight:800;margin-bottom:5px;}
  .cast{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
    border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:2px 6px;margin:0 0 5px 6px;}
  .cam{font-size:13.5px;color:var(--ink);margin:0;line-height:1.4;}
  .csub{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px;}
  .secs{font-family:var(--display);font-weight:400;font-size:21px;color:var(--ink);}
  .cbody{padding:0 15px 15px;}
  .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px;}
  .ptext{font-family:var(--mono);font-size:12.5px;line-height:1.62;color:#c6d2da;white-space:pre-wrap;
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:0;}
  .ntext{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#9aa4ad;white-space:pre-wrap;
    border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:0;}
  .cont{border:1px solid var(--warn);border-radius:8px;padding:11px 13px;margin:0;
    background:rgba(255,90,110,.07);font-size:14px;line-height:1.55;color:#f0d6da;}
  .aud{font-size:14px;color:var(--cyan);margin:0;line-height:1.5;}
  /* dialogue */
  .say{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;
    text-transform:uppercase;border-radius:4px;padding:2px 6px;margin:0 0 5px 6px;
    border:1px solid currentColor;}
  .say.line{color:#7dffb2;} .say.vo{color:#8f8fa6;} .say.sil{color:#5c5c72;}
  .quote{border-left:2px solid #7dffb2;padding:2px 0 2px 13px;margin:0;}
  .quote q{font-family:var(--display);font-weight:400;font-size:clamp(17px,2.1vw,21px);
    line-height:1.34;color:var(--ink);quotes:'“' '”';}
  .quote .who{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:#7dffb2;margin-bottom:5px;}
  .quote .how{display:block;font-size:13px;color:var(--mut);margin-top:7px;line-height:1.5;}
  .quote.off{border-left-color:var(--dim);}
  .quote.off .who{color:var(--dim);}
  .budget{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);margin-top:8px;}
  .budget.tight{color:var(--warn);}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
  .cbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    border:1px solid var(--cyan);background:transparent;color:var(--cyan);border-radius:7px;padding:8px 12px;cursor:pointer;}
  .cbtn:hover{background:rgba(0,229,255,.12);}
  .cbtn.alt{border-color:var(--line);color:var(--mut);}
  .cbtn.big{border-color:var(--cc);color:var(--cc);font-size:10.5px;padding:10px 15px;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  footer{margin:52px 0 0;padding:22px 0 0;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dim);line-height:1.9;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  @media (max-width:640px){ .ch2{grid-template-columns:auto 1fr;} .secs{grid-column:2;text-align:left;} }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Grand Theft After-Dark · “The Score” · __EYEBROW__</p>
    <h1>__H1__</h1>
    <p class="standfirst" id="stand"></p>
  </header>

  <h2 class="sec" id="howHead"></h2>
  <ol class="how" id="how"></ol>

  <div class="tools">
    <label class="sw"><input type="checkbox" id="lockedMode"><span></span>
      <b>I've built these as characters in my tool</b></label>
    <p class="toolnote" id="toolnote"></p>
  </div>

  <div class="jump" id="jump"></div>
  <div id="main"></div>

  <footer>
    GRAND THEFT AFTER-DARK · “THE SCORE” · marketing/shot-list.json<br>
    Independent fan tribute event. Not affiliated with, endorsed by, or sponsored by Rockstar Games,
    Take-Two Interactive, or any related entity.
  </footer>
</div>

<script>
(function(){
  "use strict";
  var D = /*__DATA__*/null;
  var MODE = "__MODE__";
  var $ = function(id){ return document.getElementById(id); };
  function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
  function copyBtn(label, text, cls){
    var b = el('button','cbtn'+(cls?' '+cls:''), label); b.type='button';
    b.addEventListener('click', function(e){
      e.stopPropagation();
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      var o=b.textContent; b.textContent='Copied';
      setTimeout(function(){ b.textContent=o; }, 1200);
    });
    return b;
  }
  var ROLE_C = { ESTABLISH:'#8f8fa6', BUILD:'#00e5ff', INSERT:'#f5c542', APPROACH:'#ff8ac4',
                 TURN:'#ff2d9b', HOLD:'#ff2d9b', OUT:'#a06bff', 'POST-CREDIT':'#ff5a6e' };

  /* ---- character mode -------------------------------------------------
     If you've built these people as reusable characters in your generator
     (DaVinci, Firefly, Midjourney --cref, whatever), the 40-word physical
     description in each prompt is no longer describing them — it's competing
     with the character you locked. Flip the switch and every prompt swaps
     that description for the name you gave the character. Everything else —
     action, wardrobe beat, location, lighting, lens — stays. */
  var SEEDS = {}, TOKENS = {}, LOCKED = false;
  (D.seedIndex||[]).forEach(function(ch){
    SEEDS[ch.key] = ch.seed;
    TOKENS[ch.key] = ch.name.split(' ')[0].replace(/[“”"]/g,'');
  });
  try {
    var saved = JSON.parse(localStorage.getItem('gtad.tokens')||'{}');
    Object.keys(saved).forEach(function(k){ if(TOKENS[k]) TOKENS[k]=saved[k]; });
    LOCKED = localStorage.getItem('gtad.locked') === '1';
  } catch(e){}
  function save(){
    try {
      localStorage.setItem('gtad.tokens', JSON.stringify(TOKENS));
      localStorage.setItem('gtad.locked', LOCKED ? '1' : '0');
    } catch(e){}
  }
  function NAME_OF(k){ return k === 'both' ? 'Both of them' : (TOKENS[k] || k); }
  function sub(text, cast){
    if (!LOCKED || !text) return text;
    (cast || Object.keys(SEEDS)).forEach(function(k){
      if (SEEDS[k]) text = text.split(SEEDS[k]).join(TOKENS[k]);
    });
    return text;
  }

  function clipCard(c, showCast){
    var d = el('details','clip' + (c.ensemble ? ' ens' : (['TURN','APPROACH','HOLD'].indexOf(c.role)>-1 ? ' money' : '')));
    d.style.setProperty('--rc', c.ensemble ? '#ff5a6e' : (ROLE_C[c.role] || '#8f8fa6'));
    var dg = c.dialogue || {kind:'silent', lines:[]};
    var s = el('summary','ch2');
    s.appendChild(el('div','cid', c.id));
    var mid = el('div','cmid');
    mid.appendChild(el('span','role', c.role));
    if (showCast) mid.appendChild(el('span','cast', c.cast.join(' + ')));
    mid.appendChild(el('span','say ' + (dg.kind==='speaks'?'line':(dg.kind==='voice-over'?'vo':'sil')),
      dg.kind==='speaks' ? 'Line' : (dg.kind==='voice-over' ? 'VO only' : 'No line')));
    mid.appendChild(el('p','cam', c.camera));
    mid.appendChild(el('div','csub', c.beat + ' · ' + c.beatTitle));
    s.appendChild(mid);
    s.appendChild(el('div','secs', c.seconds + 's'));
    d.appendChild(s);

    var b = el('div','cbody');
    if (c.continuity){
      b.appendChild(el('div','lbl','Continuity — read before you render'));
      b.appendChild(el('p','cont', c.continuity));
    }
    if (dg.lines && dg.lines.length){
      b.appendChild(el('div','lbl', dg.kind==='speaks' ? 'The line — it is in the prompt below'
        : 'Voice-over — record this separately, there is no mouth to sync'));
      dg.lines.forEach(function(l){
        var q = el('p','quote' + (l.placement==='on' ? '' : ' off'));
        q.appendChild(el('span','who', NAME_OF(l.speaker)
          + (l.placement==='on' ? '' : (l.placement==='vo' ? ' · voice-over' : ' · off-screen'))));
        var qq = document.createElement('q'); qq.textContent = l.line; q.appendChild(qq);
        if (l.delivery && l.placement==='on') q.appendChild(el('span','how', l.delivery));
        b.appendChild(q);
      });
      if (dg.words){
        var head = dg.seconds != null ? dg.seconds : c.seconds;
        b.appendChild(el('p','budget' + (dg.fits ? '' : ' tight'),
          dg.words + ' words ≈ ' + dg.spokenSeconds + 's spoken in a ' + c.seconds + 's clip'
          + (dg.fits ? '' : ' — TOO LONG, split it or slow the clip down')));
      }
    } else if (c.subject && c.subject !== '—' && c.subject !== 'handler'){
      b.appendChild(el('div','lbl','No line'));
      b.appendChild(el('p','aud','Silence is the direction here — the prompt tells the model to keep the mouth closed.'));
    }
    var full = sub(c.full, c.cast);
    b.appendChild(el('div','lbl','Prompt'));
    b.appendChild(el('p','ptext', full));
    b.appendChild(el('div','lbl','Negative'));
    b.appendChild(el('p','ntext', c.negative));
    // Once the line is in the prompt, repeating the audio note underneath is noise —
    // keep it only when it carries something the line doesn't (a cue, a game card).
    if (dg.kind !== 'speaks' || c.audio.indexOf('→') > -1 || c.audio.indexOf('◆') > -1){
      b.appendChild(el('div','lbl', dg.kind === 'speaks' ? 'What this line lands on' : 'Audio under it'));
      b.appendChild(el('p','aud', c.audio));
    }
    var a = el('div','acts');
    a.appendChild(copyBtn('Copy prompt', full));
    a.appendChild(copyBtn('Copy negative', c.negative, 'alt'));
    a.appendChild(copyBtn('Copy both — one box', full + ' Avoid: ' + c.negative + '.', 'alt'));
    b.appendChild(a);
    d.appendChild(b);
    return d;
  }

  function render(){
  $('main').innerHTML=''; $('jump').innerHTML=''; $('how').innerHTML='';
  if (MODE === 'characters'){
    $('stand').innerHTML ='Every single-subject clip, grouped by who is in it, so you can generate a '
      + 'whole part in one sitting and then move on. <b>' + D.meta.soloClips + ' clips</b> across '
      + D.characters.length + ' batches. ' + (LOCKED
        ? 'You\'ve built these as characters, so skip the seed and start at clip 1. '
        : 'Generate the seed first, lock the reference frame, then work straight down. ')
      + 'Shots with two or more people in frame are in the <b>ensemble list</b> — do those last.';
    $('howHead').textContent = 'How to run a batch';
    D.howToBatch.forEach(function(t){
      var li=el('li'); var i=t.indexOf('.');
      li.appendChild(el('b',null,t.slice(0,i+1)));
      li.appendChild(document.createTextNode(' '+t.slice(i+1).trim()));
      $('how').appendChild(li);
    });

    D.characters.forEach(function(ch){
      var a = el('a', null, ch.name.split(' ')[0].replace(/[“”]/g,''));
      a.href = '#c-'+ch.key; a.style.setProperty('--jc', ch.colour);
      a.appendChild(el('b', null, ch.clipCount));
      $('jump').appendChild(a);
    });

    D.characters.forEach(function(ch){
      var sec = el('section','char'); sec.id='c-'+ch.key;
      sec.style.setProperty('--cc', ch.colour);
      var h = el('div','chead');
      h.appendChild(el('h3', null, ch.name));
      h.appendChild(el('span','cnt', ch.clipCount + ' clips · ' + Math.floor(ch.seconds/60) + 'm '
        + (ch.seconds%60) + 's · ' + ch.beats.join(', ')));
      sec.appendChild(h);

      if (ch.seed){
        var sc = el('div','card seed');
        var sh = el('div','cardh');
        sh.appendChild(el('span', null, LOCKED
          ? '1 · The seed — you already have this one, skip it'
          : '1 · The seed — generate this first'));
        sh.appendChild(copyBtn('Copy seed', ch.seed + '. ' + D.blocks.STYLE + '. ' + D.blocks.PERIOD));
        sc.appendChild(sh);
        var sb = el('div','cardb');
        if (LOCKED){
          var tk = el('div','tok');
          tk.appendChild(el('span', null, 'Called, in your tool'));
          var ti = document.createElement('input');
          ti.type='text'; ti.value = TOKENS[ch.key]; ti.spellcheck = false;
          ti.setAttribute('aria-label', 'Character name for ' + ch.name);
          ti.addEventListener('change', function(){
            TOKENS[ch.key] = ti.value.trim() || ch.name.split(' ')[0]; save(); render();
          });
          tk.appendChild(ti);
          sb.appendChild(tk);
        }
        sb.appendChild(el('code', null, ch.seed));
        sc.appendChild(sb); sec.appendChild(sc);
      }
      var voice = (D.voices||{})[ch.key];
      if (voice){
        var vc = el('div','card seed'); vc.style.setProperty('--cc', ch.colour);
        var vh = el('div','cardh');
        var spoken = ch.clips.filter(function(c){ return (c.dialogue||{}).kind === 'speaks'; }).length;
        vh.appendChild(el('span', null, '2 · The voice — ' + spoken + ' of these ' + ch.clipCount
          + ' clips have a spoken line'));
        vc.appendChild(vh);
        var vb = el('div','cardb'); vb.appendChild(document.createTextNode(voice));
        vc.appendChild(vb); sec.appendChild(vc);
      }
      if (ch.lock){
        var lc = el('div','card lock');
        var lh = el('div','cardh'); lh.appendChild(el('span',null,'3 · The lock — check every render against this'));
        lc.appendChild(lh);
        var lb = el('div','cardb'); lb.appendChild(document.createTextNode(ch.lock));
        lc.appendChild(lb); sec.appendChild(lc);
      }

      var all = ch.clips.map(function(c,i){
        return '### ' + (i+1) + ' · ' + c.id + ' (' + c.seconds + 's, ' + c.role + ')\n'
             + sub(c.full, c.cast) + '\n\nNEGATIVE: ' + c.negative;
      }).join('\n\n---\n\n');
      var bar = el('div','acts'); bar.style.marginTop='14px';
      bar.appendChild(copyBtn('Copy all ' + ch.clipCount + ' prompts', all, 'big'));
      sec.appendChild(bar);

      var w = el('div','clips');
      ch.clips.forEach(function(c){ w.appendChild(clipCard(c, false)); });
      sec.appendChild(w);
      $('main').appendChild(sec);
    });

  } else {
    $('stand').innerHTML = '<b>' + D.meta.ensembleClips + ' clips</b> where two or more established '
      + 'subjects share a frame. These are re-prompted with explicit frame positions, per-subject '
      + 'lighting and a continuity note, because this is exactly where faces average together and '
      + 'people swap sides. <b>Do these last</b> — you need every solo reference frame to exist first.';
    $('howHead').textContent = 'The rules for two people in one frame';
    D.ensembleRules.forEach(function(t){
      var li=el('li'); var i=t.indexOf('.');
      li.appendChild(el('b',null,t.slice(0,i+1)));
      li.appendChild(document.createTextNode(' '+t.slice(i+1).trim()));
      $('how').appendChild(li);
    });
    var beats=[]; D.ensemble.forEach(function(c){ if(beats.indexOf(c.beat)<0) beats.push(c.beat); });
    beats.forEach(function(bt){
      var a=el('a',null,bt); a.href='#e-'+bt.replace(/\s+/g,''); a.style.setProperty('--jc','#ff5a6e');
      a.appendChild(el('b',null,D.ensemble.filter(function(c){return c.beat===bt;}).length));
      $('jump').appendChild(a);
    });
    beats.forEach(function(bt){
      var mine = D.ensemble.filter(function(c){ return c.beat===bt; });
      var sec = el('section','char'); sec.id='e-'+bt.replace(/\s+/g,'');
      sec.style.setProperty('--cc','#ff5a6e');
      var h=el('div','chead');
      h.appendChild(el('h3',null, bt + ' — ' + mine[0].beatTitle));
      h.appendChild(el('span','cnt', mine.length + ' clips · cast: ' +
        Array.from(new Set(mine.reduce(function(a,c){ return a.concat(c.cast); },[]))).join(', ')));
      sec.appendChild(h);
      var all = mine.map(function(c,i){
        return '### ' + (i+1) + ' · ' + c.id + ' (' + c.seconds + 's, ' + c.role + ')\nCAST: '
             + c.cast.join(' + ') + '\nCONTINUITY: ' + c.continuity + '\n\n' + sub(c.full, c.cast)
             + '\n\nNEGATIVE: ' + c.negative;
      }).join('\n\n---\n\n');
      var bar=el('div','acts'); bar.style.marginTop='14px';
      bar.appendChild(copyBtn('Copy all ' + mine.length + ' prompts', all, 'big'));
      sec.appendChild(bar);
      var w=el('div','clips');
      mine.forEach(function(c){ w.appendChild(clipCard(c, true)); });
      sec.appendChild(w);
      $('main').appendChild(sec);
    });
  }
  paintTools();
  }

  /* the toolbar */
  function paintTools(){
    Array.prototype.slice.call(document.querySelectorAll('.tools .tok')).forEach(function(x){
      x.parentNode.removeChild(x);
    });
    var n = $('toolnote'); n.innerHTML = '';
    if (!LOCKED){
      n.innerHTML = 'Leave this off and every prompt carries the full physical description — '
        + 'right for a generator with no memory between clips. Turn it on if you\'ve already built '
        + 'these people as reusable characters, and each prompt will call them by name instead. '
        + 'Two descriptions of the same face fight each other; one of them wins, and it isn\'t '
        + 'always yours.';
      return;
    }
    n.innerHTML = 'On. Prompts now say the character\'s name where the description used to be, '
      + 'and keep the action, wardrobe beat, location, lighting and lens. '
      + '<b>The seed step is done for anyone you\'ve built</b> — start at clip 1. '
      + 'Set the name to match exactly what you called the character in your tool:';
    if (MODE !== 'characters'){
      var row = el('div','tok'); row.style.margin = '12px 0 0'; row.style.flexWrap = 'wrap';
      Object.keys(SEEDS).forEach(function(k){
        var i = document.createElement('input');
        i.type='text'; i.value=TOKENS[k]; i.spellcheck=false;
        i.setAttribute('aria-label','Character name for '+k);
        i.style.width='150px';
        i.addEventListener('change', function(){
          TOKENS[k] = i.value.trim() || k; save(); render();
        });
        row.appendChild(i);
      });
      n.parentNode.appendChild(row);
    }
  }

  $('lockedMode').checked = LOCKED;
  $('lockedMode').addEventListener('change', function(){
    LOCKED = $('lockedMode').checked; save();
    render();
  });
  render();
})();
</script>
