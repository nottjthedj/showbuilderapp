name: Daily health check

# Runs every 24h on GitHub's infrastructure (no Claude session needed). Regenerates
# the reference show + a booth-only brand, checks every function parses, and confirms
# all modules are present. If anything drifts, the run goes red and GitHub emails you.
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (~8-9am US Eastern)
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate the reference show (GTAD)
        run: python3 make_booth.py brands/gtad.json -o /tmp/gtad

      - name: No unresolved template tokens
        run: |
          if grep -rl "{{" /tmp/gtad; then
            echo "::error::Unresolved {{ }} tokens in generated output"; exit 1
          fi
          echo "No stray tokens."

      - name: Generate a booth-only brand
        run: python3 make_booth.py brands/example-midnight-arcade.json -o /tmp/mda

      - name: Every Netlify function parses
        run: |
          set -e
          for f in $(find templates/netlify/functions -name '*.js'); do
            node --check "$f" && echo "ok  $f"
          done

      - name: All expected modules present
        run: |
          set -e
          for f in index.html booth.html crew.html handler.html gallery.html setup.html \
                   netlify/functions/sign-upload.js netlify/functions/gallery-list.js \
                   netlify/functions/gallery-action.js netlify/functions/set-cors.js \
                   netlify/functions/show-state.js netlify/functions/vote.js \
                   netlify/functions/score.js netlify/functions/crew.js; do
            test -f "/tmp/gtad/$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "All modules generated cleanly."
